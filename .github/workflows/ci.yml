name: Continuous Integration

on:
  push:
    branches:
      - main
      - "phase/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux metadata validators
        run: |
          sudo apt-get update
          sudo apt-get install --yes appstream desktop-file-utils

      - name: Compile Python sources
        run: |
          python -m compileall -q ollama_speak.py tests

      - name: Run regression tests
        run: |
          python -m unittest discover -s tests -v

      - name: Validate desktop entry
        run: |
          desktop-file-validate \
            packaging/linux/io.github.drericflores.ollama-speak.desktop

      - name: Validate AppStream metadata
        run: |
          appstreamcli validate \
            packaging/linux/io.github.drericflores.ollama-speak.metainfo.xml

  package:
    name: Build release artifacts
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=77" build

      - name: Build wheel and source distribution
        run: |
          python -m build

      - name: Build Debian package
        run: |
          sh packaging/debian/build-deb.sh build/ci-debian

      - name: Inspect Debian package
        run: |
          dpkg-deb --info build/ci-debian/ollama-speak_1.4.0_all.deb
          dpkg-deb --contents build/ci-debian/ollama-speak_1.4.0_all.deb

      - name: Record checksums
        run: |
          sha256sum \
            dist/ollama_speak-1.4.0-py3-none-any.whl \
            dist/ollama_speak-1.4.0.tar.gz \
            build/ci-debian/ollama-speak_1.4.0_all.deb \
            > SHA256SUMS
          cat SHA256SUMS

      - name: Upload qualified candidates
        uses: actions/upload-artifact@v6
        with:
          name: ollama-speak-1.4.0-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/ollama_speak-1.4.0-py3-none-any.whl
            dist/ollama_speak-1.4.0.tar.gz
            build/ci-debian/ollama-speak_1.4.0_all.deb
            SHA256SUMS
