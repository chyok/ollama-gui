[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-speak"
version = "1.4.0"
description = "A local-first Ollama desktop client with multilingual offline Piper speech."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "chyok" },
    { name = "Dr. Eric O. Flores", email = "eric@florestoro.com" },
]
keywords = ["ollama", "piper", "text-to-speech", "tkinter", "local-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/drericflores/ollama-speak"
Repository = "https://github.com/drericflores/ollama-speak"
Issues = "https://github.com/drericflores/ollama-speak/issues"

[project.scripts]
ollama-speak = "ollama_speak:run"

[tool.setuptools]
py-modules = ["ollama_speak"]
